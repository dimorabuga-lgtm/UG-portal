# Copy to wrangler.toml and replace the project/database identity before using Wrangler.
# This template contains no passwords or session secrets.
name = "ug-internal-portal"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "AUTH_RATE_LIMIT"
database_name = "ug-portal-auth"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
